name: Release

run-name: Release ${{ github.ref_name }}

# Pushing a tag such as v1.1.0 builds and tests that commit, publishes it to
# Maven Central, then publishes a GitHub release with the single jar a SQL tool
# needs attached.
#
# Central needs four repository secrets: MAVEN_GPG_PRIVATE_KEY (ASCII-armored)
# and MAVEN_GPG_PASSPHRASE to sign, and OSSRH_USERNAME and OSSRH_TOKEN, a
# Central Portal user token for the com.jasonwjones namespace.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the tag matches the version
        id: version
        run: |
          set -euo pipefail
          version="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::$version is a snapshot; set the release version in pom.xml before tagging."
            exit 1
          fi
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test and publish to Maven Central
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "target/thriller-mdx-jdbc-$VERSION-all.jar" \
            --title "Thriller $VERSION" --generate-notes
